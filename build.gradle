plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // LWJGL 3 Vulkan, VMA, Shaderc (plus Windows/Linux natives)
    implementation "org.lwjgl:lwjgl-vulkan:${project.lwjgl_version}"
    implementation "org.lwjgl:lwjgl-vma:${project.lwjgl_version}"
    runtimeOnly "org.lwjgl:lwjgl-vma:${project.lwjgl_version}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-vma:${project.lwjgl_version}:natives-linux"

    implementation "org.lwjgl:lwjgl-shaderc:${project.lwjgl_version}"
    runtimeOnly "org.lwjgl:lwjgl-shaderc:${project.lwjgl_version}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-shaderc:${project.lwjgl_version}:natives-linux"
}

tasks.register('verifyValkyrie', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.valkyrie.ValkyrieVerificationSuite'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
